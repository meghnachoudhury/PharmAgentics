# Question-reading probes for the Forecast lane (fcst-002 step 1). DRAFT until Alvin and Sienna confirm them.
# Each is a paraphrase of a persona question (CA, BM, FM stories) or an everyday one, with the scope a careful
# reader would take. The release ends 2026-10-05, so "last August" is August 2026. A month is the weeks whose
# Monday falls in it. A first or last week within seven days of the label counts as right. `intent` lists every
# acceptable reading.
